'<style>',
'.matrix{font-family:monospace;font-size:13px;fill:#00d9ff;opacity:.15}',
'.ascii{font-family:monospace;font-size:15px;letter-spacing:1px;filter:url(#glow)}',

'.scan{animation:scan 3s linear infinite;opacity:.35}',

'@keyframes scan{',
'0%{transform:translateY(-800px)}',
'100%{transform:translateY(900px)}',
'}',

'.pulse{animation:pulse 2s ease-in-out infinite alternate}',

'@keyframes pulse{',
'from{opacity:.55;filter:url(#glow)}',
'to{opacity:1;filter:url(#glow)}',
'}',

'.glitch{animation:glitch 4s infinite steps(1)}',

'@keyframes glitch{',
'0%,90%,100%{transform:translateX(0)}',
'91%{transform:translateX(-5px)}',
'92%{transform:translateX(5px)}',
'93%{transform:translateX(-3px)}',
'94%{transform:translateX(0)}',
'}',

'.rgb{animation:rgb 3s infinite alternate}',

'@keyframes rgb{',
'0%{opacity:.15}',
'50%{opacity:.7}',
'100%{opacity:.2}',
'}',

'.row1{animation:rowpulse 2s ease-in-out infinite alternate}',

'@keyframes rowpulse{',
'from{opacity:.65}',
'to{opacity:1}',
'}',

'</style></defs>',
