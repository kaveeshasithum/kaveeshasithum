
name: Generate Animated Profile Photo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ascii-photo.yml"

permissions:
  contents: write

jobs:
  generate-photo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate animated profile photo
        run: |
          mkdir -p assets

          cat > generate_photo.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math

          # GitHub profile avatar
          avatar_url = "https://github.com/kaveesithum.png"

          import urllib.request
          urllib.request.urlretrieve(avatar_url, "avatar.png")

          photo = Image.open("avatar.png").convert("RGB")

          size = 420
          photo_size = 280

          # Keep the full face visible without cropping
          photo.thumbnail((250, 250))

          background = Image.new(
              "RGB",
              (photo_size, photo_size),
              (3, 12, 22)
          )

          x = (photo_size - photo.width) // 2
          y = (photo_size - photo.height) // 2

          background.paste(photo, (x, y))
          photo = background

          # Circular photo mask
          mask = Image.new("L", (photo_size, photo_size), 0)
          mask_draw = ImageDraw.Draw(mask)
          mask_draw.ellipse(
              (0, 0, photo_size - 1, photo_size - 1),
              fill=255
          )

          photo_layer = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          photo_layer.paste(photo, (70, 70), mask)

          frames = []

          for frame_no in range(32):
              frame = Image.new(
                  "RGBA",
                  (size, size),
                  (3, 12, 22, 255)
              )

              draw = ImageDraw.Draw(frame)

              # Animated neon ring
              angle = frame_no * 360 / 32

              draw.arc(
                  (55, 55, 365, 365),
                  start=angle,
                  end=angle + 280,
                  fill=(0, 240, 255, 255),
                  width=5
              )

              draw.arc(
                  (45, 45, 375, 375),
                  start=angle + 180,
                  end=angle + 300,
                  fill=(0, 120, 255, 255),
                  width=3
              )

              # Glow effect
              glow = frame.filter(ImageFilter.GaussianBlur(12))

              frame.alpha_composite(glow)
              frame.alpha_composite(photo_layer)

              draw = ImageDraw.Draw(frame)

              # Scan line
              scan_y = 80 + ((frame_no * 9) % 260)

              draw.line(
                  (75, scan_y, 345, scan_y),
                  fill=(0, 255, 255, 100),
                  width=2
              )

              # Bottom text
              draw.text(
                  (145, 375),
                  "KAVEESHA",
                  fill=(0, 240, 255, 255)
              )

              frames.append(frame.convert("P", palette=Image.Palette.ADAPTIVE))

          frames[0].save(
              "profile-photo.gif",
              save_all=True,
              append_images=frames[1:],
              duration=80,
              loop=0,
              optimize=False
          )

          print("Profile photo generated successfully!")
          PY

          python generate_photo.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-photo.gif
          git commit -m "Update animated profile photo" || echo "No changes"
          git push
