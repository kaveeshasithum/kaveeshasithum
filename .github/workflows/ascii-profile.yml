name: Generate Animated ASCII Profile

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ascii-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow requests

      - name: Generate ASCII profile
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import requests
          from io import BytesIO
          from html import escape
          from PIL import Image, ImageOps, ImageEnhance

          # GitHub username
          user = os.environ["GH_USER"].strip()

          # Download the GitHub avatar
          headers = {"User-Agent": "GitHub-ASCII-Profile"}
          response = requests.get(
              f"https://api.github.com/users/{user}",
              headers=headers,
              timeout=30
          )
          response.raise_for_status()

          avatar_url = response.json()["avatar_url"]
          avatar_response = requests.get(
              avatar_url,
              headers=headers,
              timeout=30
          )
          avatar_response.raise_for_status()

          # Process the avatar into an ASCII-sized image
          columns = 150
          rows = 60

          image = Image.open(BytesIO(avatar_response.content)).convert("RGB")
          image = ImageOps.fit(
              image,
              (columns, rows),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.5)
          )
          image = ImageEnhance.Contrast(image).enhance(1.8)
          image = ImageEnhance.Sharpness(image).enhance(1.6)
          gray = image.convert("L")

          # Dense characters represent dark pixels; spaces represent light pixels
          chars = "@%#*+=-:. "
          palette = [
              "#003B55",
              "#006080",
              "#008EAA",
              "#00B8D9",
              "#00D9FF"
          ]

          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">',
              '<defs>',
              '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">',
              '<stop offset="0%" stop-color="#02060b"/>',
              '<stop offset="50%" stop-color="#001522"/>',
              '<stop offset="100%" stop-color="#071927"/>',
              '</linearGradient>',
              '<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">',
              '<feGaussianBlur stdDeviation="2.2" result="blur"/>',
              '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>',
              '</filter>',
              '<style>',
              '.ascii { font-family: monospace; font-size: 11px; letter-spacing: 0px; filter: url(#glow); }',
              '.pulse { animation: pulse 2.5s ease-in-out infinite alternate; }',
              '@keyframes pulse { from { opacity: .68; } to { opacity: 1; } }',
              '.scan { animation: scan 5s linear infinite; opacity: .35; }',
              '@keyframes scan { from { transform: translateY(-850px); } to { transform: translateY(900px); } }',
              '.border { animation: borderPulse 3s ease-in-out infinite alternate; }',
              '@keyframes borderPulse { from { opacity: .45; } to { opacity: 1; } }',
              '.matrix { font-family: monospace; font-size: 13px; fill: #00D9FF; opacity: .12; }',
              '</style>',
              '</defs>',

              # Background and frame
              '<rect width="1200" height="900" fill="url(#bg)"/>',
              '<rect x="22" y="22" width="1156" height="856" rx="24" fill="none" stroke="#00D9FF" stroke-width="2" opacity=".35"/>',
              '<rect class="border" x="40" y="40" width="1120" height="820" rx="22" fill="none" stroke="#00D9FF" stroke-width="2"/>'
          ]

          # Subtle matrix-style background
          for x in range(30, 1180, 35):
              for y in range(65, 850, 55):
                  pattern = "".join(
                      chars[(x + y + i * 7) % len(chars)]
                      for i in range(12)
                  )
                  svg.append(
                      f'<text class="matrix" x="{x}" y="{y}">{escape(pattern)}</text>'
                  )

          # ASCII portrait
          start_x = 105
          start_y = 145
          line_height = 11

          for y in range(rows):
              spans = []
              for x in range(columns):
                  brightness = gray.getpixel((x, y))
                  char_index = round(
                      brightness * (len(chars) - 1) / 255
                  )

                  # Keep the character and its color in the same brightness range
                  color_index = min(char_index // 2, len(palette) - 1)
                  character = escape(chars[char_index])
                  spans.append(
                      f'<tspan fill="{palette[color_index]}">{character}</tspan>'
                  )

              svg.append(
                  f'<text class="ascii pulse" xml:space="preserve" '
                  f'x="{start_x}" y="{start_y + y * line_height}">'
                  + "".join(spans)
                  + '</text>'
              )

          # Animated scan line
          svg.append(
              '<rect class="scan" x="42" y="80" width="1116" height="3" fill="#00E5FF"/>'
          )

          # Username footer
          svg.append(
              '<text x="600" y="835" text-anchor="middle" '
              'fill="#00D9FF" font-family="monospace" font-size="25" '
              'font-weight="bold" letter-spacing="4" filter="url(#glow)">'
              + escape(user.upper())
              + ' // ASCII PROFILE</text>'
          )

          svg.append('</svg>')

          with open("profile-ascii.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(svg))

          print(f"ASCII profile generated for {user} ({columns}x{rows}).")
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-ascii.svg

          if git diff --cached --quiet; then
            echo "No changes to profile-ascii.svg"
            exit 0
          fi

          git commit -m "Update animated ASCII profile"
          git push
