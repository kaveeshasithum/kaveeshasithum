
name: Generate Animated Profile Photo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ascii-photo.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate Animated Profile Photo
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import requests
          from PIL import Image, ImageDraw, ImageOps, ImageFilter
          from io import BytesIO
          import math

          user = os.environ["GH_USER"]

          response = requests.get(
              f"https://api.github.com/users/{user}",
              headers={"User-Agent": "Profile-Photo-Generator"},
              timeout=30
          )
          response.raise_for_status()

          avatar_url = response.json()["avatar_url"]
          avatar_response = requests.get(avatar_url, timeout=30)
          avatar_response.raise_for_status()

          photo = Image.open(
              BytesIO(avatar_response.content)
          ).convert("RGB")

          size = 420
          photo_size = 280
          frames = []

          photo = ImageOps.fit(
              photo,
              (photo_size, photo_size)
          )

          mask = Image.new("L", (photo_size, photo_size), 0)
          ImageDraw.Draw(mask).ellipse(
              (0, 0, photo_size - 1, photo_size - 1),
              fill=255
          )

          photo_layer = Image.new(
              "RGBA",
              (photo_size, photo_size),
              (0, 0, 0, 0)
          )
          photo_layer.paste(photo, (0, 0), mask)

          for frame_no in range(32):
              canvas = Image.new(
                  "RGBA",
                  (size, 460),
                  (3, 12, 22, 255)
              )

              draw = ImageDraw.Draw(canvas)

              draw.rounded_rectangle(
                  (8, 8, 412, 452),
                  radius=28,
                  outline=(0, 217, 255, 180),
                  width=3
              )

              # Original profile photo
              canvas.paste(
                  photo_layer,
                  (70, 70),
                  photo_layer
              )

              # Animated neon ring
              ring = Image.new("RGBA", canvas.size, (0, 0, 0, 0))
              ring_draw = ImageDraw.Draw(ring)

              start = frame_no * 11

              ring_draw.arc(
                  (55, 55, 365, 365),
                  start=start,
                  end=start + 270,
                  fill=(0, 225, 255, 255),
                  width=7
              )

              ring = ring.filter(ImageFilter.GaussianBlur(5))
              canvas = Image.alpha_composite(canvas, ring)

              ring_sharp = Image.new(
                  "RGBA", canvas.size, (0, 0, 0, 0)
              )
              ImageDraw.Draw(ring_sharp).arc(
                  (55, 55, 365, 365),
                  start=start,
                  end=start + 270,
                  fill=(0, 230, 255, 255),
                  width=4
              )
              canvas = Image.alpha_composite(canvas, ring_sharp)

              # Moving scan line clipped to the photo
              scan_y = 70 + ((frame_no * 10) % photo_size)

              scan = Image.new(
                  "RGBA",
                  (photo_size, photo_size),
                  (0, 0, 0, 0)
              )
              scan_draw = ImageDraw.Draw(scan)

              local_y = scan_y - 70
              scan_draw.rectangle(
                  (0, local_y, photo_size, local_y + 3),
                  fill=(0, 230, 255, 170)
              )

              scan.putalpha(
                  ImageChops_multiply(scan.getchannel("A"), mask)
              )

              canvas.alpha_composite(scan, (70, 70))

              draw = ImageDraw.Draw(canvas)
              draw.text(
                  (210, 400),
                  user.upper(),
                  fill=(0, 220, 255, 255),
                  anchor="mm"
              )
              draw.text(
                  (210, 425),
                  "GITHUB DEVELOPER",
                  fill=(130, 190, 210, 255),
                  anchor="mm"
              )

              frames.append(canvas.convert("P", palette=Image.Palette.ADAPTIVE))

          frames[0].save(
              "profile-photo.gif",
              save_all=True,
              append_images=frames[1:],
              duration=80,
              loop=0,
              optimize=False
          )

          print("Animated profile photo generated successfully!")

          PY

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-photo.gif
          git commit -m "Update animated profile photo" || exit 0
          git push
