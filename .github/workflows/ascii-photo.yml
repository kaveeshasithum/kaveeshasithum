name: Generate Animated ASCII Profile

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ascii-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate ASCII portrait SVG
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import requests
          from PIL import Image, ImageOps, ImageEnhance
          from io import BytesIO
          from html import escape

          user = os.environ["GH_USER"].strip()
          headers = {"User-Agent": "GitHub-ASCII-Profile-Generator"}

          api_response = requests.get(
              f"https://api.github.com/users/{user}",
              headers=headers,
              timeout=30
          )
          api_response.raise_for_status()
          avatar_url = api_response.json()["avatar_url"]

          avatar_response = requests.get(avatar_url, headers=headers, timeout=30)
          avatar_response.raise_for_status()

          image = Image.open(BytesIO(avatar_response.content)).convert("RGB")
          image = ImageOps.fit(image, (100, 48))
          image = ImageEnhance.Contrast(image).enhance(1.35)
          gray = image.convert("L")

          chars = "@%#*+=-:. "
          palette = ["#003B55", "#006080", "#008EAA", "#00B8D9", "#00D9FF"]

          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">',
              '<defs>',
              '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">',
              '<stop offset="0%" stop-color="#02060b"/><stop offset="100%" stop-color="#071927"/>',
              '</linearGradient>',
              '<filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/>',
              '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>',
              '<style>',
              '.matrix{font-family:monospace;font-size:13px;fill:#00d9ff;opacity:.15}',
              '.ascii{font-family:monospace;font-size:15px;letter-spacing:1px;filter:url(#glow)}',
              '.scan{animation:scan 5s linear infinite;opacity:.2}',
              '@keyframes scan{0%{transform:translateY(-800px)}100%{transform:translateY(900px)}}',
              '.pulse{animation:pulse 2.4s ease-in-out infinite alternate}',
              '@keyframes pulse{from{opacity:.7}to{opacity:1}}',
              '</style></defs>',
              '<rect width="1200" height="900" fill="url(#bg)"/>',
              '<rect x="22" y="22" width="1156" height="856" rx="24" fill="none" stroke="#00d9ff" stroke-width="2" opacity=".65"/>'
          ]

          for x in range(30, 1180, 35):
              text = "".join(chars[(x + i * 7) % len(chars)] for i in range(42))
              svg.append(f'<text class="matrix" x="{x}" y="50">{escape(text)}</text>')

          for y in range(48):
              spans = []
              for x in range(100):
                  brightness = gray.getpixel((x, y))
                  idx = int(brightness * (len(chars) - 1) / 255)
                  color = palette[min(idx // 2, 4)]
                  spans.append(f'<tspan fill="{color}">{escape(chars[idx])}</tspan>')
              svg.append(
                  f'<text class="ascii pulse" xml:space="preserve" x="230" y="{170 + y*15}">'
                  + "".join(spans) + '</text>'
              )

          svg += [
              '<rect class="scan" x="30" y="80" width="1140" height="3" fill="#00e5ff"/>',
              '<text x="600" y="830" text-anchor="middle" fill="#00e5ff" font-family="monospace" font-size="25" letter-spacing="5">KAVEESITHUM // ASCII PROFILE</text>',
              '</svg>'
          ]

          with open("profile-ascii.svg", "w", encoding="utf-8") as f:
              f.write("\\n".join(svg))
          print(f"Generated profile-ascii.svg for @{user}")
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-ascii.svg
          git commit -m "Update animated ASCII profile" || exit 0
          git push
