
name: Generate ASCII Photo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ascii-photo.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install pillow requests

      - name: Generate ASCII Photo
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          import requests
          from PIL import Image, ImageOps, ImageEnhance
          from io import BytesIO
          from html import escape

          user = os.environ["GH_USER"]
          headers = {"User-Agent": "ASCII-Profile"}

          r = requests.get(
              f"https://api.github.com/users/{user}",
              headers=headers,
              timeout=30
          )
          r.raise_for_status()

          avatar_url = r.json()["avatar_url"]

          r = requests.get(avatar_url, timeout=30)
          r.raise_for_status()

          img = Image.open(BytesIO(r.content)).convert("RGB")
          img = ImageOps.fit(img, (100, 50))
          img = ImageEnhance.Contrast(img).enhance(1.4)
          img = img.convert("L")

          chars = "@%#*+=-:. "
          colors = [
              "#003B55",
              "#006080",
              "#008EAA",
              "#00B8D9",
              "#00D9FF"
          ]

          svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">',
              '<defs>',
              '<linearGradient id="bg"><stop stop-color="#02060b"/><stop offset="1" stop-color="#071927"/></linearGradient>',
              '<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>',
              '<style>',
              '.ascii{font-family:monospace;font-size:15px;letter-spacing:1px;filter:url(#glow)}',
              '.scan{animation:scan 5s linear infinite;opacity:.25}',
              '@keyframes scan{from{transform:translateY(-800px)}to{transform:translateY(900px)}}',
              '.pulse{animation:pulse 2s infinite alternate}',
              '@keyframes pulse{from{opacity:.6}to{opacity:1}}',
              '</style></defs>',
              '<rect width="1200" height="900" fill="url(#bg)"/>',
              '<rect x="20" y="20" width="1160" height="860" rx="20" fill="none" stroke="#00D9FF" stroke-width="2"/>'
          ]

          # Matrix background
          for x in range(30, 1180, 35):
              text = "".join(chars[(x+i*7) % len(chars)] for i in range(45))
              svg.append(
                  f'<text x="{x}" y="50" fill="#00D9FF" opacity=".15" font-family="monospace">{escape(text)}</text>'
              )

          # ASCII portrait
          for y in range(50):
              spans = []
              for x in range(100):
                  b = img.getpixel((x, y))
                  i = int(b * (len(chars)-1) / 255)
                  color = colors[min(i//2, 4)]
                  spans.append(
                      f'<tspan fill="{color}">{escape(chars[i])}</tspan>'
                  )

              svg.append(
                  f'<text class="ascii pulse" xml:space="preserve" x="230" y="{160+y*14}">'
                  + "".join(spans) + '</text>'
              )

          svg.append(
              '<rect class="scan" x="30" y="80" width="1140" height="3" fill="#00D9FF"/>'
          )

          svg.append(
              '<text x="600" y="850" text-anchor="middle" fill="#00D9FF" font-family="monospace" font-size="25">KAVEESITHUM // ASCII PROFILE</text>'
          )

          svg.append('</svg>')

          with open("profile-ascii.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(svg))

          print("ASCII photo generated successfully!")
          PY

      - name: Commit ASCII Photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-ascii.svg
          git commit -m "Generate ASCII profile photo" || exit 0
          git push
